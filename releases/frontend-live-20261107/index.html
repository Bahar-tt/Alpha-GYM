    <script>
      // Remove stale Service Workers/Cache Storage from older deployments.
      // Deliberately preserve localStorage: the bearer token lives there.
      (async function alphaGymCacheGuard() {
        try {
          var registrations = await navigator.serviceWorker.getRegistrations();
          var cacheNames = await caches.keys();
          var changed = registrations.length > 0 || cacheNames.length > 0;
          await Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
          await Promise.all(cacheNames.map(function (cacheName) { return caches.delete(cacheName); }));
          var reloadKey = 'alpha_gym_cache_guard_reload_v1';
          if (changed && !sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            location.reload();
          } else if (!changed) {
            sessionStorage.removeItem(reloadKey);
          }
        } catch (error) {
          console.warn('Alpha GYM cache guard skipped:', error);
        }
      })();
    </script>
